[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pllsim"
version = "0.5.3"
description = "System-level / behavioral simulation models for PLLs: CPPLL, SSPLL, SPLL, ADPLL, ILCM with noise, spur and calibration analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7"]
gui = ["streamlit>=1.30"]
guiqt = ["PySide6>=6.5"]

[project.scripts]
pllsim-gui = "pllsim.guiqt.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pllsim.guiqt" = ["*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
