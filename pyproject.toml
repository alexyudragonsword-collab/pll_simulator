[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pllsim"
version = "0.9.2"
description = "System-level / behavioral simulation models for PLLs: CPPLL, SSPLL, SPLL, ADPLL, ILCM, MDLL with noise, spur and calibration analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # Floors are measured, not aspirational: the full suite passes on Python
    # 3.10 with numpy 1.24.4 + scipy 1.8.1 (the oldest stack the Android
    # build can get -- Chaquopy's scipy wheels stop at Python 3.10).  numpy
    # 1.24 was a lie until core/jitter.py stopped calling np.trapezoid,
    # which only exists in numpy>=2.
    "numpy>=1.24",
    "scipy>=1.8",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7"]
gui = ["streamlit>=1.30"]
guiqt = ["PySide6>=6.5"]

[project.scripts]
pllsim-gui = "pllsim.guiqt.app:main"
pllsim-web = "pllsim.webgui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pllsim.guiqt" = ["*.png"]
"pllsim.webgui" = ["*.py", "*.png", "pages/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.report]
# Measured 91%.  The floor sits a few points below so routine churn does not
# trip it, while a module that loses its tests does.
#
# Two things this number does NOT say.  The Streamlit pages under
# webgui/pages/ are driven by 23 tests through streamlit's AppTest, which
# execs each file rather than importing it, so coverage attributes none of it
# -- the pages are absent from the report entirely and Home.py/_common.py read
# 0% while their tests pass.  Do not "fix" those by writing a test that
# imports them; the tests that matter already exist in test_gui_smoke.py and
# test_gui_compute.py.  And a covered line is a line that ran, not a line
# whose answer was checked -- which is why the physics is pinned by
# cross-domain comparison rather than by this number.
fail_under = 88
skip_covered = true

[tool.mypy]
# No python_version pin.  mypy parses the installed stubs against whatever
# version it is told, so pinning 3.11 made the 3.12 CI job fail on numpy's
# own .pyi ("type statement is only supported in Python 3.12 and greater").
# Following the running interpreter is also what a matrix build is for.
ignore_missing_imports = true
# The whole package: export/ and webgui/ were the last two paths out (24 and
# 15 errors), fixed rather than silenced.  If something must leave the gate,
# it goes in docs/gen_roadmap.py's TYPE_CANDIDATES so the cost stays measured.
files = ["src/pllsim"]

[tool.ruff]
line-length = 88
extend-exclude = ["examples/out"]

[tool.ruff.lint]
# E501 off: the physics comments carry derivations that read worse rewrapped
select = ["E", "F", "W", "I"]
# E731: the per-architecture t_target_of mappings read better as
# one-line lambdas next to the call that consumes them
ignore = ["E501", "E741", "E731"]

[tool.ruff.lint.per-file-ignores]
# the Streamlit pages must call st.set_page_config() before importing pllsim,
# so their imports are deliberately not at the top of the file
"src/pllsim/webgui/**" = ["E402"]
"packaging/**" = ["E402"]
"src/pllsim/guiqt/app.py" = ["E402"]
"examples/**" = ["E402"]
"src/pllsim/__init__.py" = ["F401"]
