name: windows-exe

# PyInstaller Windows executables (fast build, self-extracting).  The build
# itself lives in windows-exe-build.yml, shared with the Nuitka entry; this
# file is the Actions UI entry that picks the builder.
#
# Trigger from the GitHub UI: Actions -> windows-exe -> Run workflow.
# `target` picks which GUI to build; building both is a deliberate choice
# rather than the default.  Optionally give an existing release tag (e.g.
# v0.9.3) to attach the exes to that release as downloadable assets.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which GUI to build"
        type: choice
        required: true
        default: qt
        options: [qt, web, both]
      release_tag:
        description: "Existing release tag to attach the exes to (optional)"
        required: false
        default: ""

jobs:
  build:
    uses: ./.github/workflows/windows-exe-build.yml
    permissions:
      contents: write
    with:
      builder: pyinstaller
      target: ${{ inputs.target }}
      release_tag: ${{ inputs.release_tag }}
