name: Android APK

# Manual only.  The APK is a sideload artifact, not a release gate, and the
# Chaquopy build (SDK + three native wheels per ABI) costs real runner
# minutes on a private repo's monthly budget -- so it runs when a human asks,
# not on every push.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "navigation shell to build"
        type: choice
        default: both
        options: [both, tabs, drawer]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          # Chaquopy's buildPython must match the version in
          # android/app/build.gradle.kts -- 3.10, the newest Python for
          # which its repository has a scipy wheel (chaquo/chaquopy#1237)
          python-version: "3.10"
      - name: Build the pllsim sdist the app embeds
        # not install("../..") in the Gradle config: a directory install
        # makes the whole repo -- including the Gradle project's own build
        # outputs -- an input of the pip task, which Gradle 8's validation
        # rejects as an undeclared dependency on every AGP task
        run: |
          pip install build
          python -m build --sdist --outdir android/app/pysrc .
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.2"
      # product flavors mean there is no plain assembleDebug: each shell is
      # its own variant, with its own applicationId suffix, so both can be
      # installed side by side for comparison
      - name: Build tabs APK
        if: inputs.variant == 'both' || inputs.variant == 'tabs'
        run: gradle -p android :app:assembleTabsDebug
      - uses: actions/upload-artifact@v4
        if: inputs.variant == 'both' || inputs.variant == 'tabs'
        with:
          name: pllsim-tabs-debug-apk
          path: android/app/build/outputs/apk/tabs/debug/app-tabs-debug.apk
          if-no-files-found: error
      - name: Build drawer APK
        if: inputs.variant == 'both' || inputs.variant == 'drawer'
        run: gradle -p android :app:assembleDrawerDebug
      - uses: actions/upload-artifact@v4
        if: inputs.variant == 'both' || inputs.variant == 'drawer'
        with:
          name: pllsim-drawer-debug-apk
          path: android/app/build/outputs/apk/drawer/debug/app-drawer-debug.apk
          if-no-files-found: error
