name: Android APK

# Manual only.  The APK is a sideload artifact, not a release gate, and the
# Chaquopy build (SDK + three native wheels per ABI) costs real runner
# minutes on a private repo's monthly budget -- so it runs when a human asks,
# not on every push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          # Chaquopy's buildPython must match the version in
          # android/app/build.gradle.kts -- 3.10, the newest Python for
          # which its repository has a scipy wheel (chaquo/chaquopy#1237)
          python-version: "3.10"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.2"
      - name: Build debug APK
        run: gradle -p android :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pllsim-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
