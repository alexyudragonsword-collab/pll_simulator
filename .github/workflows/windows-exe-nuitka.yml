name: windows-exe-nuitka

# Nuitka Windows executables (real C compilation via MSVC — much slower
# builds, faster startup than PyInstaller's self-extract).  The build itself
# lives in windows-exe-build.yml, shared with the PyInstaller entry; this
# file is the Actions UI entry that picks the builder.
#
# Trigger from the GitHub UI: Actions -> windows-exe-nuitka -> Run workflow.
# The web compile is the long one (~80 min cold, minutes from the cache), so
# building both is a deliberate choice rather than the default.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which GUI to build"
        type: choice
        required: true
        default: qt
        options: [qt, web, both]
      release_tag:
        description: "Existing release tag to attach the exes to (optional)"
        required: false
        default: ""

jobs:
  build:
    uses: ./.github/workflows/windows-exe-build.yml
    permissions:
      contents: write
    with:
      builder: nuitka
      target: ${{ inputs.target }}
      release_tag: ${{ inputs.release_tag }}
