name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq iverilog
          python -m pip install --upgrade pip
          pip install -e .[test]
      - name: Run tests
        run: pytest tests/ -v --tb=short
      - name: Run examples (smoke, reduced plots check)
        if: matrix.python-version == '3.11'
        run: |
          python examples/ex01_cppll_intn_19p2m_4p8g.py
          test -f examples/out/ex01_pn_breakdown.png
          python examples/ex13_export_vams.py
          test -f examples/out/export/INDEX.md
