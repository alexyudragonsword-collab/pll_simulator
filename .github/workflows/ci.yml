name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: write

jobs:
  auto-release:
    # the session git proxy cannot push tags and the MCP token cannot
    # dispatch workflows, so releases ride on branch pushes: any
    # docs/release-notes/v*.md without a matching tag gets tagged+released
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The version in pyproject must have notes
        # v0.9.1 and v0.9.2 both merged to main and neither was ever released:
        # this job walks docs/release-notes/, so a version bump with no notes
        # file leaves it nothing to do -- and doing nothing is a legitimate
        # success, so it went green twice while shipping nothing.  Fail loudly
        # instead.  Only on main: a branch mid-development has not decided its
        # version yet.
        if: github.ref == 'refs/heads/main'
        run: |
          V=$(python -c "import tomllib,pathlib; \
            print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ ! -f "docs/release-notes/v$V.md" ]; then
            echo "::error::pyproject is at $V but docs/release-notes/v$V.md" \
                 "does not exist, so this release would never be tagged"
            exit 1
          fi
      - name: Tag and release pending versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # tag each version at the last commit that actually carried it in
          # pyproject, not at HEAD.  Two versions can be pending at once (they
          # were, after v0.9.1 and v0.9.2 both shipped without notes), and
          # tagging both at HEAD would make `git checkout v0.9.1` hand out
          # v0.9.2's tree -- a tag pointing at the wrong code is worse than a
          # missing one.  Walking HEAD also keeps tags on main: the older ones
          # were placed at $GITHUB_SHA of a *branch* push, so several of them
          # point at pre-squash commits that main's history does not contain.
          # Those are published and left alone; this only fixes new ones.
          target_for() {
            git log --format=%H --reverse HEAD | while read -r c; do
              v=$(git show "$c:pyproject.toml" 2>/dev/null \
                  | grep -m1 '^version = ' | cut -d'"' -f2)
              [ "v$v" = "$1" ] && echo "$c"
            done | tail -1
          }
          for f in docs/release-notes/v*.md; do
            [ -e "$f" ] || continue
            V=$(basename "$f" .md)
            if ! git ls-remote --exit-code --tags origin "refs/tags/$V" >/dev/null 2>&1; then
              T=$(target_for "$V")
              if [ -z "$T" ]; then
                echo "::warning::no commit carries version ${V#v}; tagging at HEAD"
                T="$GITHUB_SHA"
              fi
              # created through the API, not `git push`.  Pushing a tag that
              # points at an older commit means creating a ref whose
              # .github/workflows/ci.yml differs from the current one, and
              # GITHUB_TOKEN is categorically barred from that -- "refusing to
              # allow a GitHub App to create or update workflow ... without
              # workflows permission", which no permission setting grants.
              # The git refs API is not subject to that rule.
              TAG_SHA=$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/tags" \
                -f tag="$V" -f object="$T" -f type=commit \
                -f message="$(cat "$f")" --jq .sha)
              gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$V" -f sha="$TAG_SHA" >/dev/null
              echo "tagged $V at ${T:0:7}"
            fi
            if ! gh release view "$V" >/dev/null 2>&1; then
              gh release create "$V" --title "pllsim $V" --notes-file "$f"
            fi
          done

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq iverilog \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3
          python -m pip install --upgrade pip
          pip install -e .[test,gui,guiqt]
          pip install ruff mypy pytest-cov
      - name: Lint
        run: ruff check src tests examples packaging
      - name: Type check
        # the file list is in pyproject [tool.mypy]: the physics core, the
        # blocks, the calibrators and the analysis modules -- everything whose
        # types carry a convention.  arch/ and webgui/ are named there as not
        # yet covered rather than silenced, so this gate cannot be mistaken
        # for whole-package checking.
        run: mypy
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ -v --tb=short --cov=pllsim --cov-report=term-missing:skip-covered
      - name: Run examples (fast subset)
        if: matrix.python-version == '3.11'
        run: |
          python examples/ex01_cppll_intn_19p2m_4p8g.py
          test -f examples/out/ex01_pn_breakdown.png
          python examples/ex13_export_vams.py
          test -f examples/out/export/INDEX.md
          python examples/ex21_corners_lock_pulling.py
          test -f examples/out/ex21_corner_jitter.png
      - name: Run every example (main only)
        # the examples are the figures in docs/ and the only exercise several
        # code paths get, but the full sweep is ~20 min of runner time and
        # this is a private repo on a monthly minute budget -- so it gates
        # merges to main rather than charging every branch push for it
        if: matrix.python-version == '3.11' && github.ref == 'refs/heads/main'
        run: |
          for f in examples/ex*.py; do echo "--- $f"; python "$f" >/dev/null; done
