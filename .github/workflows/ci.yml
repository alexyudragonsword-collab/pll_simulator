name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: write

jobs:
  auto-release:
    # Any docs/release-notes/v*.md without a matching tag gets tagged and
    # released.  main only: the tag lands on $GITHUB_SHA, so running this on
    # branch pushes tags a commit that squash-merging then removes from
    # history -- which is how several older tags came to point at commits main
    # does not contain, and which this job did to v0.9.2 before the guard
    # existed.  A release must be reachable from the branch it shipped on.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The version in pyproject must have notes
        # v0.9.1 and v0.9.2 both merged to main and neither was ever released:
        # this job walks docs/release-notes/, so a version bump with no notes
        # file leaves it nothing to do -- and doing nothing is a legitimate
        # success, so it went green twice while shipping nothing.  Fail loudly
        # instead.
        run: |
          V=$(python -c "import tomllib,pathlib; \
            print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ ! -f "docs/release-notes/v$V.md" ]; then
            echo "::error::pyproject is at $V but docs/release-notes/v$V.md" \
                 "does not exist, so this release would never be tagged"
            exit 1
          fi
      - name: Tag and release pending versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Tags land on the commit being pushed, and there is no choice
          # about that: tagging an *older* commit is impossible from CI.  A ref
          # whose .github/workflows/ci.yml differs from the current one is
          # refused to GITHUB_TOKEN both by git push ("without workflows
          # permission" -- a PAT scope no permissions block can grant) and by
          # the refs API (403).  So a version bumped without notes cannot be
          # backfilled afterwards, which is what the step above enforces.
          for f in docs/release-notes/v*.md; do
            [ -e "$f" ] || continue
            V=$(basename "$f" .md)
            # a version that was bumped but never released says so in its own
            # notes; the file stays as the record of what changed in that step
            if grep -q '<!-- no-tag:' "$f"; then
              echo "$V: marked no-tag, skipping"
              continue
            fi
            if ! git ls-remote --exit-code --tags origin "refs/tags/$V" >/dev/null 2>&1; then
              git tag -a "$V" -F "$f"
              git push origin "$V"
            fi
            if gh release view "$V" >/dev/null 2>&1; then
              continue                      # already released; nothing to do
            fi
            # About to build a release on a tag that already existed.  If that
            # tag is off this branch the release would land on the wrong code,
            # so stop.  The check belongs *here* and not next to the tagging
            # above: several historical tags point at pre-squash commits main
            # never contained, and they are published and fine -- guarding
            # them broke every run until this was narrowed to the case that
            # can actually do damage.
            if ! git merge-base --is-ancestor \
                 "$(git rev-list -n1 "$V")" HEAD 2>/dev/null; then
              echo "::error::$V is tagged at a commit not in main's history" \
                   "and has no release; delete the tag" \
                   "(git push origin :refs/tags/$V) so it can be recreated here"
              exit 1
            fi
            gh release create "$V" --title "pllsim $V" \
              --target "$GITHUB_SHA" --notes-file "$f"
          done

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # tags, so the release-notes checks in test_docs_consistency.py run
          # for real -- without them they skip, which is indistinguishable
          # from passing
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq iverilog \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3
          python -m pip install --upgrade pip
          pip install -e .[test,gui,guiqt]
          pip install ruff mypy pytest-cov
      - name: Lint
        run: ruff check src tests examples packaging
      - name: Type check
        # the whole package: pyproject [tool.mypy] says files=["src/pllsim"].
        # If a path ever has to leave the gate it goes in gen_roadmap.py's
        # TYPE_CANDIDATES, where its cost is measured, not remembered.
        run: mypy
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ -v --tb=short --cov=pllsim --cov-report=term-missing:skip-covered
      - name: Run examples (fast subset)
        if: matrix.python-version == '3.11'
        run: |
          python examples/ex01_cppll_intn_19p2m_4p8g.py
          test -f examples/out/ex01_pn_breakdown.png
          python examples/ex13_export_vams.py
          test -f examples/out/export/INDEX.md
          python examples/ex21_corners_lock_pulling.py
          test -f examples/out/ex21_corner_jitter.png
      - name: Run every example (main only)
        # the examples are the figures in docs/ and the only exercise several
        # code paths get, but the full sweep is ~20 min of runner time and
        # this is a private repo on a monthly minute budget -- so it gates
        # merges to main rather than charging every branch push for it
        if: matrix.python-version == '3.11' && github.ref == 'refs/heads/main'
        run: |
          for f in examples/ex*.py; do echo "--- $f"; python "$f" >/dev/null; done
