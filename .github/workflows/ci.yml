name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: write

# A newer push to the same branch supersedes the run in flight; on main the
# in-flight run may be tagging a release, so it is left to finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  auto-release:
    # Any docs/release-notes/v*.md without a matching tag gets tagged and
    # released.  main only: the tag lands on $GITHUB_SHA, so running this on
    # branch pushes tags a commit that squash-merging then removes from
    # history -- which is how several older tags came to point at commits main
    # does not contain, and which this job did to v0.9.2 before the guard
    # existed.  A release must be reachable from the branch it shipped on.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: The version in pyproject must have notes
        # v0.9.1 and v0.9.2 both merged to main and neither was ever released:
        # this job walks docs/release-notes/, so a version bump with no notes
        # file leaves it nothing to do -- and doing nothing is a legitimate
        # success, so it went green twice while shipping nothing.  Fail loudly
        # instead.
        run: |
          V=$(python -c "import tomllib,pathlib; \
            print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ ! -f "docs/release-notes/v$V.md" ]; then
            echo "::error::pyproject is at $V but docs/release-notes/v$V.md" \
                 "does not exist, so this release would never be tagged"
            exit 1
          fi
      - name: Tag and release pending versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Tags land on the commit being pushed, and there is no choice
          # about that: tagging an *older* commit is impossible from CI.  A ref
          # whose .github/workflows/ci.yml differs from the current one is
          # refused to GITHUB_TOKEN both by git push ("without workflows
          # permission" -- a PAT scope no permissions block can grant) and by
          # the refs API (403).  So a version bumped without notes cannot be
          # backfilled afterwards, which is what the step above enforces.
          for f in docs/release-notes/v*.md; do
            [ -e "$f" ] || continue
            V=$(basename "$f" .md)
            # a version that was bumped but never released says so in its own
            # notes; the file stays as the record of what changed in that step
            if grep -q '<!-- no-tag:' "$f"; then
              echo "$V: marked no-tag, skipping"
              continue
            fi
            if ! git ls-remote --exit-code --tags origin "refs/tags/$V" >/dev/null 2>&1; then
              git tag -a "$V" -F "$f"
              git push origin "$V"
            fi
            if gh release view "$V" >/dev/null 2>&1; then
              continue                      # already released; nothing to do
            fi
            # About to build a release on a tag that already existed.  If that
            # tag is off this branch the release would land on the wrong code,
            # so stop.  The check belongs *here* and not next to the tagging
            # above: several historical tags point at pre-squash commits main
            # never contained, and they are published and fine -- guarding
            # them broke every run until this was narrowed to the case that
            # can actually do damage.
            if ! git merge-base --is-ancestor \
                 "$(git rev-list -n1 "$V")" HEAD 2>/dev/null; then
              echo "::error::$V is tagged at a commit not in main's history" \
                   "and has no release; delete the tag" \
                   "(git push origin :refs/tags/$V) so it can be recreated here"
              exit 1
            fi
            gh release create "$V" --title "pllsim $V" \
              --target "$GITHUB_SHA" --notes-file "$f"
          done

  # The cross-domain parameter matrix and the per-field sensitivity gate
  # (markers `sweep` and `sensitivity`).
  # Its own job, in parallel with `test`, so the ~45-point sweep costs no
  # wall clock on the main suite.  Single Python (3.11), no GUI/iverilog
  # apt packages, no coverage: a subset run would trip the fail_under floor,
  # and the sweep measures physics, not line coverage.
  cross-domain-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test] pytest-xdist
      - name: Run the sweep
        run: pytest tests/ -m "sweep or sensitivity" -n 4 -v --tb=short

  # The declared floor (requires-python >= 3.10, numpy 1.24, scipy 1.8) is
  # also the interpreter the Android app embeds -- and until this job it was
  # the one combination CI never ran.  Library only: the GUI extras do not
  # resolve against these pins, so the GUI suites skip here by design and
  # this leg carries no coverage floor (a subset run would trip it).  Read
  # the "selected" count in the log, not the colour.
  test-minimum:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - name: Install the floor
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq iverilog \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3
          python -m pip install --upgrade pip
          pip install "numpy==1.24.4" "scipy==1.8.1" "matplotlib==3.7.5"
          pip install -e .[test,gui,guiqt] pytest-xdist
      - name: The floor is still the floor
        # a GUI extra that quietly pulled a newer numpy would make this job
        # test some other floor; refuse rather than report the wrong one
        run: |
          python - <<'PY'
          import numpy, scipy, matplotlib
          got = (numpy.__version__, scipy.__version__, matplotlib.__version__)
          want = ("1.24.4", "1.8.1", "3.7.5")
          print("numpy/scipy/matplotlib:", *got)
          assert got == want, f"floor drifted: {got} != {want}"
          PY
      - name: Run the suite on the floor
        env:
          QT_QPA_PLATFORM: offscreen
          PLLSIM_CI: "1"   # a missing optional dependency fails; it must not skip
        # same selection as the 3.11/3.12 job: read the "[N items]" line and
        # compare -- a module-level skip hides a whole file behind one item
        run: pytest tests/ -m "not sweep and not sensitivity" -n 4 -v --tb=short

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
        with:
          # tags, so the release-notes checks in test_docs_consistency.py run
          # for real -- without them they skip, which is indistinguishable
          # from passing
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq iverilog \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3
          python -m pip install --upgrade pip
          pip install -e .[test,gui,guiqt,fast]
          pip install ruff mypy pytest-cov pytest-xdist
      - name: Lint
        run: ruff check src tests examples packaging docs
      - name: Type check
        # the whole package: pyproject [tool.mypy] says files=["src/pllsim"].
        # If a path ever has to leave the gate it goes in gen_roadmap.py's
        # TYPE_CANDIDATES, where its cost is measured, not remembered.
        run: mypy
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          PLLSIM_CI: "1"   # a missing optional dependency fails; it must not skip
          # 3.11 runs the kernels interpreted and carries the coverage floor;
          # 3.12 runs them compiled and carries no coverage.  Both legs must
          # exist: a numba-compiled function never executes its Python lines,
          # so measuring coverage with the kernels compiled read 84% against
          # a real 92% and failed the floor on nothing.  Coverage is "which
          # lines ran", and the kernel source lines are the lines; the
          # compiled path is proved equal to them by tests/test_kernels.py,
          # which drives both in its own subprocesses whatever this says.
          PLLSIM_JIT: ${{ matrix.python-version == '3.11' && '0' || '1' }}
        # the cross-domain matrix and the field-sensitivity gate run in their
        # own parallel job.  -n 4: the hosted runner has four cores and the
        # suite is deterministic (seed=0 default); measured 15 -> 10 min.
        run: |
          if [ "${PLLSIM_JIT}" = "0" ]; then
            pytest tests/ -m "not sweep and not sensitivity" -n 4 -v --tb=short \
              --cov=pllsim --cov-report=term-missing:skip-covered
          else
            pytest tests/ -m "not sweep and not sensitivity" -n 4 -v --tb=short -p no:cacheprovider
          fi
      - name: Run examples (fast subset)
        if: matrix.python-version == '3.11'
        run: |
          python examples/ex01_cppll_intn_19p2m_4p8g.py
          test -f examples/out/ex01_pn_breakdown.png
          python examples/ex13_export_vams.py
          test -f examples/out/export/INDEX.md
          python examples/ex21_corners_lock_pulling.py
          test -f examples/out/ex21_corner_jitter.png
      - name: Run every example (main only)
        # the examples are the figures in docs/ and the only exercise several
        # code paths get, but this is a private repo on a monthly minute
        # budget -- so it gates merges to main rather than charging every
        # branch push for it.
        #
        # On 3.12, the compiled leg, because 3.11 is the tight one: it runs
        # the kernels interpreted *and* carries the coverage floor, which put
        # its pytest step at 31:39 of a 45-minute job budget on run 325.
        # This step costs the same either way -- it never had a PLLSIM_JIT of
        # its own, so it has always run numba-compiled on whichever leg hosts
        # it, which is also why it takes 1:44 and not the "~20 min" this
        # comment claimed until the kernels landed.
        if: matrix.python-version == '3.12' && github.ref == 'refs/heads/main'
        run: |
          for f in examples/ex*.py; do echo "--- $f"; python "$f" >/dev/null; done
