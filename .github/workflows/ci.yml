name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: write

jobs:
  auto-release:
    # the session git proxy cannot push tags and the MCP token cannot
    # dispatch workflows, so releases ride on branch pushes: any
    # docs/release-notes/v*.md without a matching tag gets tagged+released
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag and release pending versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in docs/release-notes/v*.md; do
            [ -e "$f" ] || continue
            V=$(basename "$f" .md)
            if ! git ls-remote --exit-code --tags origin "refs/tags/$V" >/dev/null 2>&1; then
              git tag -a "$V" -F "$f"
              git push origin "$V"
            fi
            if ! gh release view "$V" >/dev/null 2>&1; then
              gh release create "$V" --title "pllsim $V" \
                --target "$GITHUB_SHA" --notes-file "$f"
            fi
          done

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq iverilog \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3
          python -m pip install --upgrade pip
          pip install -e .[test,gui,guiqt]
          pip install ruff pytest-cov
      - name: Lint
        run: ruff check src tests examples packaging
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ -v --tb=short --cov=pllsim --cov-report=term-missing:skip-covered
      - name: Run examples (smoke, reduced plots check)
        if: matrix.python-version == '3.11'
        run: |
          # every example, not two: they are the figures in docs/ and the
          # only exercise several code paths get
          for f in examples/ex*.py; do echo "--- $f"; python "$f" >/dev/null; done
          test -f examples/out/ex01_pn_breakdown.png
          test -f examples/out/export/INDEX.md
