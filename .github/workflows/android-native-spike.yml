name: Android APK (compiled core, spike)

# A spike, not a release path.  It answers one question the container this was
# written in could not: does Cython-generated C for pllsim's modelling core
# actually cross-compile against Chaquopy's Android CPython, install through
# Chaquopy's pip, and produce a working APK?
#
# Everything else was already measured on the host:
#   * Cython handles all 31 core/arch/blocks/calibration modules unchanged
#   * the full suite passes with those as .so and no .py present
#     (564 passed / 13 skipped), analyze() bit-identical at 258.3043 fs
#   * the compiled subset is 4.7 MB per ABI
#   * --no-docstrings removes the PSD convention note that `strings` otherwise
#     prints straight out of a compiled module
#
# Manual only, like the APK build it copies.  Keep it that way until the
# question is answered; then either fold it into android.yml or delete it.

on:
  workflow_dispatch:
    inputs:
      abis:
        description: "ABIs to build (space separated)"
        default: "arm64-v8a x86_64"

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          # must match android/app/build.gradle.kts, and the wheels this
          # produces are tagged cp310 -- a mismatch here yields wheels
          # Chaquopy's pip will refuse as unsupported
          python-version: "3.10"

      # Report, do not assume.  The runner image is documented to carry an
      # NDK, but "documented" is how the two GUIs drifted; if this step prints
      # nothing the rest of the job is meaningless and should fail here.
      - name: Locate the NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROID_NDK_LATEST_HOME=$ANDROID_NDK_LATEST_HOME"
          ls -d $ANDROID_SDK_ROOT/ndk/* 2>/dev/null || true
          ndk="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          test -d "$ndk" || { echo "::error::no NDK on this runner"; exit 1; }
          echo "NDK=$ndk" >> $GITHUB_ENV
          ls "$ndk/toolchains/llvm/prebuilt"

      - name: Install build tools
        run: pip install build cython

      - name: Cross-compile the core and build one wheel per ABI
        run: |
          for abi in ${{ inputs.abis }}; do
            python packaging/android_wheel.py --abi "$abi" --ndk "$NDK"
          done
          ls -la android/app/pysrc/

      # The wheels must actually be ARM64/x86-64 Android objects, not host
      # ones that happened to build.  readelf says so in one line, and it
      # costs nothing next to discovering it on a phone.
      - name: Check the machine type of what came out
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          from pathlib import Path
          ok = True
          for whl in sorted(glob.glob("android/app/pysrc/pllsim-*.whl")):
              with zipfile.ZipFile(whl) as z:
                  so = next(n for n in z.namelist() if n.endswith(".so"))
                  data = z.read(so)
              # ELF header: e_machine at offset 18, little-endian
              machine = int.from_bytes(data[18:20], "little")
              names = {0xB7: "AArch64", 0x3E: "x86-64", 0x28: "ARM"}
              print(f"{Path(whl).name}: {so} -> {names.get(machine, hex(machine))}")
              expected = 0xB7 if "arm64" in whl else 0x3E
              if machine != expected:
                  print(f"::error::{whl} is not the architecture its tag claims")
                  ok = False
          sys.exit(0 if ok else 1)
          PY

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.2"
      - name: Build the APK against the compiled wheels
        run: gradle -p android :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pllsim-debug-apk-compiled-core
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # What actually landed inside: .so and no .py under core/ means the
      # compilation reached the APK rather than being quietly bypassed.
      - name: Show what the APK carries for pllsim.core
        run: |
          python - <<'PY'
          import zipfile
          apk = "android/app/build/outputs/apk/debug/app-debug.apk"
          import io
          with zipfile.ZipFile(apk) as z:
              inner = [n for n in z.namelist() if n.endswith(".imy")]
              print("chaquopy payloads:", inner)
              for name in inner:
                  # read into memory: a nested ZipFile over a stream is
                  # fragile, and these payloads are tens of MB at worst
                  with zipfile.ZipFile(io.BytesIO(z.read(name))) as p:
                      core = [n for n in p.namelist() if "pllsim/core/" in n]
                      if core:
                          print(f"  {name}:")
                          for n in sorted(core):
                              print("   ", n)
          PY
